services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQLSERVER_PASSWORD:?Define SQLSERVER_PASSWORD en .env}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${SQLSERVER_PASSWORD:?Define SQLSERVER_PASSWORD en .env}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -Q "IF DB_ID('pcdex') IS NULL EXEC('CREATE DATABASE [pcdex]');"
  migrate:
    build: .
    environment:
      DATABASE_URL: "sqlserver://sqlserver:1433;database=pcdex;user=sa;password={${SQLSERVER_PASSWORD:?Define SQLSERVER_PASSWORD en .env}};encrypt=true;trustServerCertificate=true"
    depends_on:
      db-init:
        condition: service_completed_successfully
    command: ["npm", "run", "prisma:deploy"]
  api:
    build: .
    environment:
      DATABASE_URL: "sqlserver://sqlserver:1433;database=pcdex;user=sa;password={${SQLSERVER_PASSWORD:?Define SQLSERVER_PASSWORD en .env}};encrypt=true;trustServerCertificate=true"
      PORT: "3000"
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
volumes:
  sqlserver-data:
