services:
  pcdex-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Define MSSQL_SA_PASSWORD in your env file}
      MSSQL_PID: Developer
    ports:
      - "127.0.0.1:1434:1433"
    volumes:
      - pcdex-functional-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
  backend:
    profiles: [app]
    build: ./backend
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:?Define DOCKER_DATABASE_URL when using --profile app}
      SESSION_SECRET: ${SESSION_SECRET:?Define SESSION_SECRET}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?Define TOTP_ENCRYPTION_KEY}
      FRONTEND_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      HOST: 0.0.0.0
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      pcdex-db:
        condition: service_healthy
  frontend:
    profiles: [app]
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
volumes:
  pcdex-functional-sql-data:
