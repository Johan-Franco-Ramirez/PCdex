name: Validar PCDex

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validar:

    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Verificar README
        run: test -f README.md

      - name: Verificar Backend
        run: test -f backend/package.json

      - name: Verificar Docker Compose
        env:
          MYSQL_PASSWORD: verificacion_ci
          MYSQL_ROOT_PASSWORD: verificacion_root_ci
          EMAIL_CODE_SECRET: clave_de_verificacion_temporal_ci_123456
        run: docker compose -f backend/compose.yaml config --quiet

      - name: Verificar Frontend
        run: test -d frontend

      - name: Proyecto validado
        run: echo "PCDex validado correctamente"
