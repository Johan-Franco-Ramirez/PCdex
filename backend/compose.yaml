services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: pcdex
      MYSQL_USER: pcdex
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en .env.mysql}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env.mysql}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  migrate:
    build: .
    environment:
      DATABASE_URL: "mysql://pcdex:${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en .env.mysql}@mysql:3306/pcdex"
    depends_on:
      mysql:
        condition: service_healthy
    command: ["npm", "run", "prisma:deploy"]
  api:
    build: .
    environment:
      DATABASE_URL: "mysql://pcdex:${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en .env.mysql}@mysql:3306/pcdex"
      PORT: "3000"
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:80"
volumes:
  mysql-data:
